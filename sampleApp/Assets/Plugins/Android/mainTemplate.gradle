apply plugin: 'com.android.library'
**APPLY_PLUGINS**

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
// Android Resolver Dependencies Start
    implementation 'androidx.appcompat:appcompat:1.3.0' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:6
    implementation 'androidx.lifecycle:lifecycle-process:[2.5.1,3.0.0)' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:13
    implementation 'androidx.multidex:multidex:2.0.1' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:5
    implementation 'com.google.android.gms:play-services-base:17.6.0' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:4
    implementation 'jp.supership.vamp:vamp-admob-adapter:[24.9.0,25.0.0)' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:13
    implementation 'jp.supership.vamp:vamp-applovin-adapter:[13.5.100,14.0.0)' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:15
    implementation 'jp.supership.vamp:vamp-ironsource-adapter:[8.11.1,9.0.0)' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:21
    implementation 'jp.supership.vamp:vamp-lineads-adapter:[3.0.100,4.0.0)' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:23
    implementation 'jp.supership.vamp:vamp-maio-adapter:[2.0.800,3.0.0)' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:29
    implementation 'jp.supership.vamp:vamp-pangle-adapter:[7.9.10200,8.0.0)' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:35
    implementation 'jp.supership.vamp:vamp-sdk:5.3.5' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:11
    implementation 'jp.supership.vamp:vamp-unityads-adapter:4.16.600' // Assets/ExternalDependencyManager/Editor/VAMPDependencies.xml:40
// Android Resolver Dependencies End
**DEPS**}

// Android Resolver Exclusions Start
android {
  packagingOptions {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/armeabi-v7a/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    namespace 'jp.supership.vamp.sample.lib'
    ndkPath '**NDKPATH**'
    ndkVersion '**NDKVERSION**'

    compileSdk **APIVERSION**
    buildToolsVersion = '**BUILDTOOLS**'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk **MINSDK**
        targetSdk **TARGETSDK**
        ndk {
            abiFilters **ABIFILTERS**
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
        }
        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'
        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**
**DEFAULT_CONFIG_SETUP**
    }

    lint {
        abortOnError false
    }

    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }**PACKAGING**
}
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
